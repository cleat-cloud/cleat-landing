name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CSS must be committed and in sync
        run: npm run check:css

      - name: Required files exist
        run: |
          for f in index.html pt/index.html assets/htmx.min.js \
                   partials/panel.html partials/cli.html partials/mcp.html \
                   pt/partials/panel.html pt/partials/cli.html pt/partials/mcp.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: HTML is valid
        run: npm run check:html

      - name: Internal links and assets exist
        run: npm run check:links

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke (EN + PT-BR) and axe
        run: npm run test:smoke

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cleat-cloud/cleat-cli
          path: .cleat-cli

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Build cleat CLI
        working-directory: .cleat-cli
        run: mix deps.get && mix escript.build

      - name: Publish landing
        env:
          CLEAT_PANEL_URL: ${{ secrets.CLEAT_PANEL_URL }}
          CLEAT_TOKEN: ${{ secrets.CLEAT_TOKEN }}
        run: .cleat-cli/cleat drop . --app cleat --watch
